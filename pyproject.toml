[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp2hwpx"
version = "1.0.1.post2"
description = "Convert HWP (Hangul Word Processor) files to HWPX format"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["hwp", "hwpx", "hangul", "korean", "document", "converter", "owpml", "hancom", "word-processor", "file-conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
hwp2hwpx = "hwp2hwpx.cli:main"

[project.urls]
Homepage = "https://github.com/kossembly-dot/hwp2hwpx"
Repository = "https://github.com/kossembly-dot/hwp2hwpx"
Issues = "https://github.com/kossembly-dot/hwp2hwpx/issues"
Original-Java-Library = "https://github.com/neolord0/hwp2hwpx"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwp2hwpx = ["jars/*.jar"]
